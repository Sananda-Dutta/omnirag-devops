apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: omnirag
resources:
  - namespace.yaml
  - configmap.yaml
  - redis.yaml
  - qdrant.yaml
  - uploads-pvc.yaml
  - backend.yaml
  - worker.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml
# secret.example.yaml and migrate-job.yaml are applied separately:
#   kubectl apply -f secret.yaml   (created from the template, never committed)
#   kubectl apply -f migrate-job.yaml   (once per release, before rolling out the API)
