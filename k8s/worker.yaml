apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: omnirag
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: ghcr.io/YOUR-USER/omnirag-backend:latest
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
          envFrom:
            - configMapRef: {name: omnirag-config}
            - secretRef: {name: omnirag-secrets}
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1536Mi}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
