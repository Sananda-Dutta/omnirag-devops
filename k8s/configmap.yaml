apiVersion: v1
kind: ConfigMap
metadata:
  name: omnirag-config
  namespace: omnirag
data:
  APP_ENV: "production"
  DEBUG: "false"
  VECTOR_DB_URL: "http://qdrant:6333"
  REDIS_URL: "redis://redis:6379/0"
  LLM_PROVIDER: "openai"
  OPENAI_BASE_URL: "https://api.groq.com/openai/v1"
  OPENAI_CHAT_MODEL: "openai/gpt-oss-120b"
