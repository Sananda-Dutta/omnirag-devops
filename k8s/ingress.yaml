apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnirag
  namespace: omnirag
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
spec:
  ingressClassName: nginx
  rules:
    - host: omnirag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
