name: OmniRAG DevOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnirag
          POSTGRES_PASSWORD: omnirag
          POSTGRES_DB: omnirag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnirag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333

    steps:
      - name: Checkout DevOps repository
        uses: actions/checkout@v4

      - name: Checkout OmniRAG application
        uses: actions/checkout@v4
        with:
          repository: Sananda-Dutta/Omnirag
          path: omnirag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: omnirag/omnirag/backend
        run: pip install -r requirements.txt

      - name: Configure test environment
        working-directory: omnirag/omnirag/backend
        run: cp .env.example .env

      - name: Run backend tests
        working-directory: omnirag/omnirag/backend
        run: pytest tests/ -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OmniRAG application
        uses: actions/checkout@v4
        with:
          repository: Sananda-Dutta/Omnirag
          path: omnirag

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: omnirag/omnirag/frontend
        run: npm ci

      - name: TypeScript check
        working-directory: omnirag/omnirag/frontend
        run: npx tsc -b

      - name: Build frontend
        working-directory: omnirag/omnirag/frontend
        run: npm run build

  docker-images:
    name: Docker Build and Push
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OmniRAG application
        uses: actions/checkout@v4
        with:
          repository: Sananda-Dutta/Omnirag
          path: omnirag

      - name: Prepare Docker build contexts
        run: |
          cp backend/Dockerfile omnirag/omnirag/backend/Dockerfile
          cp backend/.dockerignore omnirag/omnirag/backend/.dockerignore
          cp frontend/Dockerfile omnirag/omnirag/frontend/Dockerfile
          cp frontend/.dockerignore omnirag/omnirag/frontend/.dockerignore
          cp frontend/Caddyfile omnirag/omnirag/frontend/Caddyfile

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./omnirag/omnirag/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/omnirag-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./omnirag/omnirag/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/omnirag-frontend:latest
