
name: OmniRAG DevOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      APP_ENV: local
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://omnirag:omnirag@localhost:5432/omnirag_test
      REDIS_URL: redis://localhost:6379/0
      VECTOR_DB_URL: http://localhost:6333
      SECRET_KEY: ci-test-secret-not-for-production
      LLM_PROVIDER: local
      EMBEDDING_PROVIDER: local
      EMBEDDING_DIMENSION: "384"
      EVAL_PROVIDER: local

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnirag
          POSTGRES_PASSWORD: omnirag
          POSTGRES_DB: omnirag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnirag -d omnirag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333

    steps:
      - name: Checkout DevOps repository
        uses: actions/checkout@v4

      - name: Checkout clean OmniRAG source
        uses: actions/checkout@v4
        with:
          repository: Sananda-Dutta/Omnirag
          ref: ci-source-clean
          path: omnirag

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: omnirag/omnirag/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Qdrant
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:6333/readyz; then
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready"
          exit 1

      - name: Run backend tests
        working-directory: omnirag/omnirag/backend
        run: pytest tests/ -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DevOps repository
        uses: actions/checkout@v4

      - name: Checkout clean OmniRAG source
        uses: actions/checkout@v4
        with:
          repository: Sananda-Dutta/Omnirag
          ref: ci-source-clean
          path: omnirag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: omnirag/omnirag/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: omnirag/omnirag/frontend
        run: npm ci

      - name: TypeScript check
        working-directory: omnirag/omnirag/frontend
        run: npx tsc -b

      - name: Build frontend
        working-directory: omnirag/omnirag/frontend
        run: npm run build

  docker-images:
    name: Docker Build and Push
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DevOps repository
        uses: actions/checkout@v4

      - name: Checkout clean OmniRAG source
        uses: actions/checkout@v4
        with:
          repository: Sananda-Dutta/Omnirag
          ref: ci-source-clean
          path: omnirag

      - name: Prepare Docker build contexts
        run: |
          cp backend/Dockerfile omnirag/omnirag/backend/Dockerfile
          cp backend/.dockerignore omnirag/omnirag/backend/.dockerignore
          cp frontend/Dockerfile omnirag/omnirag/frontend/Dockerfile
          cp frontend/.dockerignore omnirag/omnirag/frontend/.dockerignore
          cp frontend/Caddyfile omnirag/omnirag/frontend/Caddyfile

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./omnirag/omnirag/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/sananda-dutta/omnirag-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./omnirag/omnirag/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/sananda-dutta/omnirag-frontend:latest